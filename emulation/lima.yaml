# Linux VM for the emulation on macOS:  limactl start --name=edge emulation/lima.yaml
# Then:  limactl shell edge  (the repo is mounted read-write at the same path)
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
cpus: 4
memory: "8GiB"
mounts:
  - location: "~/Documents/Shajarah"
    writable: true
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      apt-get update
      apt-get install -y python3-venv python3-pip iproute2 iptables ethtool linux-modules-extra-$(uname -r) || true
      modprobe sch_netem || true
